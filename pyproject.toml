[project]
name = "dsh-launcher"
version = "1.1.0"
description = "DeepSeek Harness launcher that stays open across plugin-market restarts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=6.0.0",
  "pystray>=0.19.5",
  "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/martjay/DSH-Lancher"
Repository = "https://github.com/martjay/DSH-Lancher"

[project.optional-dependencies]
build = ["pyinstaller>=6.11.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
dsh-launcher = "dsh_launcher.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_launcher"]

[tool.hatch.build.targets.sdist]
include = [
  "src/dsh_launcher",
  "assets/dsh.ico",
  "README.md",
]

